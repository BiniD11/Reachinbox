services:
  # ----------------------------------------------------
  # Single Unified Web Service (Frontend + Backend + Workers)
  # ----------------------------------------------------
  - type: web
    name: reachinbox-app
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: email-scheduler-db
          property: connectionString
      - key: REDIS_URL
        sync: false # Paste your existing Render Redis Internal URL here
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_EMAILS_PER_HOUR
        value: "200"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "100"
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_DELAY_BETWEEN_SENDS_MS
        value: "2000"

# ----------------------------------------------------
# Managed PostgreSQL Database
# ----------------------------------------------------
databases:
  - name: email-scheduler-db
    databaseName: email_scheduler
    user: reachinbox_user
    plan: free
