services:
  # ----------------------------------------------------
  # Redis Key-Value Cache for BullMQ Queues & Limiting
  # ----------------------------------------------------
  - type: redis
    name: email-scheduler-redis
    ipAllowList: [] # only allow internal services
    plan: free
    maxmemoryPolicy: noeviction

  # ----------------------------------------------------
  # Express.js + BullMQ Backend API
  # ----------------------------------------------------
  - type: web
    name: email-scheduler-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: email-scheduler-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: email-scheduler-redis
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: email-scheduler-frontend
          property: url
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_EMAILS_PER_HOUR
        value: 200
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 100
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_BETWEEN_SENDS_MS
        value: 2000

  # ----------------------------------------------------
  # Next.js 14 Frontend Dashboard
  # ----------------------------------------------------
  - type: web
    name: email-scheduler-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: email-scheduler-backend
          property: url

# ----------------------------------------------------
# Managed PostgreSQL Database
# ----------------------------------------------------
databases:
  - name: email-scheduler-db
    databaseName: email_scheduler
    user: postgres
    plan: free
